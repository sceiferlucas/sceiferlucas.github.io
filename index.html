<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controle Financeiro Semanal</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#111827;
    color:white;
    padding:20px;
    font-family:Arial;
}

.card-custom{
    background:#1f2937;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
}

input,
select{
    margin-bottom:10px;
}

.lista-item{
    background:#374151;
    padding:12px;
    border-radius:10px;
    margin-bottom:10px;
}

.entrada{
    border-left:5px solid #10b981;
}

.gasto{
    border-left:5px solid #ef4444;
}

.valor-positivo{
    color:#10b981;
    font-weight:bold;
}

.valor-negativo{
    color:#ef4444;
    font-weight:bold;
}

.resumo{
    font-size:20px;
    font-weight:bold;
}

button{
    width:100%;
}

.semana-atual{
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
    color:#60a5fa;
}

.controle-semana{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.info-semana{
    background:#111827;
    padding:10px;
    border-radius:10px;
    margin-bottom:15px;
    border:1px solid #374151;
}

</style>

</head>

<body>

<div class="container">

    <h1 class="text-center mb-4">
        Controle Financeiro Semanal
    </h1>

    <div class="card-custom">

        <div
            id="semanaAtual"
            class="semana-atual">
        </div>

        <div
            id="infoSemana"
            class="info-semana">
        </div>

        <div class="controle-semana">

            <button
                class="btn btn-secondary"
                onclick="semanaAnterior()">

                ← Semana Anterior

            </button>

            <button
                class="btn btn-secondary"
                onclick="proximaSemana()">

                Próxima Semana →

            </button>

        </div>

        <h4>Adicionar Registro</h4>

        <select
            id="tipo"
            class="form-control">

            <option value="entrada">
                Entrada
            </option>

            <option value="gasto">
                Gasto
            </option>

        </select>

        <select
            id="categoria"
            class="form-control">

            <option value="fixo">
                Fixo
            </option>

            <option value="variavel">
                Variável
            </option>

        </select>

        <input
            type="text"
            id="descricao"
            class="form-control"
            placeholder="Descrição">

        <input
            type="number"
            id="valor"
            class="form-control"
            placeholder="Valor">

        <input
            type="date"
            id="data"
            class="form-control"
            readonly>

        <button
            class="btn btn-primary"
            onclick="adicionarRegistro()">

            Salvar Registro

        </button>

    </div>

    <div class="card-custom">

        <h4>Resumo da Semana</h4>

        <div class="resumo">

            Entradas:
            <span
                id="totalEntradas"
                class="valor-positivo">

                R$ 0,00

            </span>

        </div>

        <div class="resumo">

            Gastos:
            <span
                id="totalGastos"
                class="valor-negativo">

                R$ 0,00

            </span>

        </div>

        <div class="resumo">

            Saldo:
            <span id="saldoFinal">

                R$ 0,00

            </span>

        </div>

    </div>

    <div class="card-custom">

        <h4>Registros da Semana</h4>

        <div id="listaRegistros"></div>

    </div>

    <div class="card-custom">

        <button
            class="btn btn-danger"
            onclick="limparTudo()">

            Apagar Tudo

        </button>

    </div>

</div>

<script>

let registros =
    JSON.parse(
        localStorage.getItem(
            "registrosFinanceiros"
        )
    ) || [];

let semanaOffset = 0;

function salvarLocal(){

    localStorage.setItem(
        "registrosFinanceiros",
        JSON.stringify(registros)
    );
}

function definirDataAtual(){

    const hoje = new Date();

    hoje.setDate(
        hoje.getDate() + (semanaOffset * 7)
    );

    const ano = hoje.getFullYear();

    const mes = String(
        hoje.getMonth() + 1
    ).padStart(2, "0");

    const dia = String(
        hoje.getDate()
    ).padStart(2, "0");

    document.getElementById("data").value =
        `${ano}-${mes}-${dia}`;
}

function pegarInicioSemana(dataAtual){

    const data = new Date(dataAtual);

    const diaSemana = data.getDay();

    let diferenca;

    if(diaSemana >= 4){

        diferenca = diaSemana - 4;

    }else{

        diferenca = 7 - (4 - diaSemana);
    }

    data.setDate(
        data.getDate() - diferenca
    );

    data.setHours(0,0,0,0);

    return data;
}

function pegarFimSemana(inicioSemana){

    const fim = new Date(inicioSemana);

    fim.setDate(
        fim.getDate() + 6
    );

    fim.setHours(23,59,59,999);

    return fim;
}

function formatarData(data){

    return data.toLocaleDateString("pt-BR");
}

function pegarNumeroSemana(data){

    const inicioMes =
        new Date(
            data.getFullYear(),
            data.getMonth(),
            1
        );

    const diferencaDias =
        Math.floor(
            (data - inicioMes)
            / (1000 * 60 * 60 * 24)
        );

    return Math.floor(
        diferencaDias / 7
    ) + 1;
}

function pegarSemanaAtual(){

    const hoje = new Date();

    hoje.setDate(
        hoje.getDate() + (semanaOffset * 7)
    );

    const inicio =
        pegarInicioSemana(hoje);

    const fim =
        pegarFimSemana(inicio);

    const numeroSemana =
        pegarNumeroSemana(inicio);

    const nomeMes =
        inicio.toLocaleDateString(
            "pt-BR",
            { month: "long" }
        );

    return {

        inicio,

        fim,

        numeroSemana,

        nomeMes,

        texto:
            "Semana "
            + numeroSemana
            + " de "
            + nomeMes
    };
}

function semanaAnterior(){

    semanaOffset--;

    definirDataAtual();

    atualizarTela();
}

function proximaSemana(){

    semanaOffset++;

    definirDataAtual();

    atualizarTela();
}

function adicionarRegistro(){

    const tipo =
        document.getElementById("tipo").value;

    const categoria =
        document.getElementById("categoria").value;

    const descricao =
        document.getElementById("descricao").value;

    const valor =
        parseFloat(
            document.getElementById("valor").value
        );

    const data =
        document.getElementById("data").value;

    if(!descricao || !valor){

        alert("Preencha todos os campos");

        return;
    }

    const semanaAtual =
        pegarSemanaAtual();

    const registro = {

        id: Date.now(),

        tipo,

        categoria,

        descricao,

        valor,

        data,

        semana:
            semanaAtual.texto
    };

    registros.push(registro);

    salvarLocal();

    atualizarTela();

    limparFormulario();
}

function limparFormulario(){

    document.getElementById("descricao").value = "";

    document.getElementById("valor").value = "";

    definirDataAtual();
}

function atualizarTela(){

    const lista =
        document.getElementById(
            "listaRegistros"
        );

    lista.innerHTML = "";

    let totalEntradas = 0;

    let totalGastos = 0;

    const semanaAtual =
        pegarSemanaAtual();

    document.getElementById(
        "semanaAtual"
    ).innerText =
        semanaAtual.texto;

    document.getElementById(
        "infoSemana"
    ).innerHTML = `

        <strong>
            Período:
        </strong>

        ${formatarData(semanaAtual.inicio)}

        até

        ${formatarData(semanaAtual.fim)}

    `;

    registros.reverse().forEach(registro => {

        if(
            registro.semana
            !== semanaAtual.texto
        ){
            return;
        }

        const div =
            document.createElement("div");

        div.classList.add("lista-item");

        if(registro.tipo === "entrada"){

            div.classList.add("entrada");

            totalEntradas += registro.valor;

        }else{

            div.classList.add("gasto");

            totalGastos += registro.valor;
        }

        div.innerHTML = `

            <div class="d-flex justify-content-between">

                <div>

                    <strong>
                        ${registro.descricao}
                    </strong>

                    <br>

                    Tipo:
                    ${registro.tipo}

                    <br>

                    Categoria:
                    ${registro.categoria}

                    <br>

                    Data:
                    ${registro.data}

                </div>

                <div>

                    <strong class="${
                        registro.tipo === "entrada"
                        ? "valor-positivo"
                        : "valor-negativo"
                    }">

                    ${
                        registro.tipo === "entrada"
                        ? "+"
                        : "-"
                    }

                    R$ ${registro.valor.toFixed(2)}

                    </strong>

                    <br><br>

                    <button
                        class="btn btn-sm btn-dark"
                        onclick="removerRegistro(${registro.id})">

                        Excluir

                    </button>

                </div>

            </div>

        `;

        lista.appendChild(div);

    });

    registros.reverse();

    document.getElementById(
        "totalEntradas"
    ).innerText =
        "R$ " +
        totalEntradas.toFixed(2);

    document.getElementById(
        "totalGastos"
    ).innerText =
        "R$ " +
        totalGastos.toFixed(2);

    const saldo =
        totalEntradas - totalGastos;

    const saldoElemento =
        document.getElementById(
            "saldoFinal"
        );

    saldoElemento.innerText =
        "R$ " +
        saldo.toFixed(2);

    saldoElemento.style.color =
        saldo >= 0
        ? "#10b981"
        : "#ef4444";
}

function removerRegistro(id){

    registros =
        registros.filter(
            r => r.id !== id
        );

    salvarLocal();

    atualizarTela();
}

function limparTudo(){

    const confirmar =
        confirm(
            "Deseja apagar todos os registros?"
        );

    if(confirmar){

        registros = [];

        salvarLocal();

        atualizarTela();
    }
}

definirDataAtual();

atualizarTela();

</script>

</body>
</html>
